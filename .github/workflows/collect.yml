
name: FlyRadar News Collector

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Collect official news
        run: python collector.py

      - name: Save collected news
        run: |
          git config user.name "FlyRadar Bot"
          git config user.email "flyradar-bot@users.noreply.github.com"
          git add data/alerts.json
          git diff --cached --quiet || git commit -m "Update FlyRadar news"
          git push
